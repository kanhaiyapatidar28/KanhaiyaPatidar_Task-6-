<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log-in Page</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <section class="left-section">
        <img class="left image" src="https://png.pngtree.com/png-vector/20240322/ourmid/pngtree-home-service-house-cleaning-and-laundry-wash-png-image_12190003.png" alt="Left Image">
    </section>

    <section class="right-section">
        <div id="login-form">
        <h1>Hello Again</h1>
        <p>Welcome back you've been missed!</p>
        <form id="form1" action="index.html" method="post">
            <label for="email">Email:</label>
            <input type="text" placeholder="Enter Your Email" name="email" required>
            <label for="password">Password:</label>
            <input type="password" placeholder="Enter Your Password" name="password" required>
            <a id="forgot-password" href="forgot-password.html">Forgot Password?</a>
            <button type="submit">Log In</button>
        </form>
        </div>
    </section>
</body>
</html>
